<!DOCTYPE html>
<html>
<head>
    <title>Spot AI</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="apple-touch-icon"
          sizes="180x180"
          href="favicon/apple-touch-icon.png">
    <link rel="icon"
          type="image/png"
          sizes="32x32"
          href="favicon/favicon-32x32.png">
    <link rel="icon"
          type="image/png"
          sizes="16x16"
          href="favicon/favicon-16x16.png">
    <link rel="manifest"
          href="favicon/site.webmanifest">
    <link rel="mask-icon"
          href="favicon/safari-pinned-tab.svg"
          color="#5bbad5">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href="voice_assistant_simple.css">
</head>
<body>
    <header class="header-logo">
        <img class="logo-light" src="bridge.png" alt="Bridge logo">
        <img class="logo-dark" src="bridge (1).png" alt="Bridge logo">
    </header>
    <div class="container">
        <div class="top-left">
            <div class="dropdown">
                <button class="neumorphic-button">Autonomous Inspection</button>
                <div class="dropdown-content">
                    <a href="digital_factory.html">Digital Factory</a>
                    <a href="hsse.html">HSSE</a>
                </div>
            </div>
            
        </div>
        <div class="image-container">
            <img src="Spot_qturn.png" alt="Spot AI Robot">
        </div>
        <div class="top-right">
            <a onclick="startwwd()" class="neumorphic-button">Smart Assistant</a>
        </div>
        <div class="bottom-left">
            <a href="http://192.168.208.88:8004/" class="neumorphic-button">Guided Tour</a>
        </div>
        <div class="bottom-right">
            <a href="https://192.168.208.117" class="neumorphic-button" target="_blank">Spot Admin</a>
        </div>
    </div>
    <!-- Demo-only: theme toggle -->
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 1 0 9.79 9.79z"></path>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" fill="currentColor"></circle>
            <path d="M12 2v3m0 14v3m10-10h-3M5 12H2m15.07-7.07-2.12 2.12M8.05 15.95l-2.12 2.12m0-12.02 2.12 2.12m9.02 9.02 2.12 2.12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
        </svg>
    </button>

    <!-- Simple Speech Bubble -->
    <div id="simple-chat-bubble" class="simple-chat-bubble">
        <div class="bubble-content">
            <button class="bubble-close" onclick="stopAssistant()" title="Close">✕</button>
            <div id="bubble-text" class="bubble-text">
                Say "Hey Spot" or "Hi Spot" to start...
            </div>
        </div>
    </div>

    <script src="voice_assistant_simple.js"></script>
    <script src="smartassistant.js"></script>
</body>
</html>
