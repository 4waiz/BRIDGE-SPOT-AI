<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="author" content="Bridge Spot AI" />
    <meta name="description" content="Spot, Guide, LIF, Edge, Tour" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="apple-touch-icon"
          sizes="180x180"
          href="{{ url_for('static', filename='favicon/apple-touch-icon.png') }}">
    <link rel="icon"
          type="image/png"
          sizes="32x32"
          href="{{ url_for('static', filename='favicon/favicon-32x32.png') }}">
    <link rel="icon"
          type="image/png"
          sizes="16x16"
          href="{{ url_for('static', filename='favicon/favicon-16x16.png') }}">
    <link rel="manifest"
          href="{{ url_for('static', filename='favicon/site.webmanifest') }}">
    <link rel="mask-icon"
          href="{{ url_for('static', filename='favicon/safari-pinned-tab.svg') }}"
          color="#5bbad5">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#ffffff">
    <title>{{ title }}</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/bootstrap.min.css') }}"/>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/base.css') }}"/>
    {% if self.styles() %}
      {% block styles %}
      {% endblock styles %}
    {% endif %}
  </head>
  <body>
    <!--[if IE]>
      <p class="browserupgrade">
        You are using an <strong>outdated</strong> browser. Please
        <a href="https://browsehappy.com/">upgrade your browser</a> to improve your experience and security.
      </p>
    <![endif]-->
    <main>
      {% block content %}
      {% endblock content %}
    </main>
    <script src="{{ url_for('static', filename='js/bootstrap.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/jquery-3.6.3.min.js') }}"></script>
    {% block js %}
    {% endblock js %}
  </body>
</html>
